# ═══════════════════════════════════
# อัปเดตไฟล์ .github/workflows/daily.yml
# ═══════════════════════════════════
name: YouTube Long Clip Digest
on:
  schedule:
    # 0 0 * * * คือ 07:00 น. เวลาไทย
    # 0 11 * * * คือ 18:00 น. เวลาไทย
    - cron: '0 0 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python main.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          YT_KEY: ${{ secrets.YT_KEY }}
